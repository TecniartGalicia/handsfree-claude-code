name: Release

# Tag vX.Y.Z (on a commit reachable from main) → check, package, publish to VS Marketplace + Open VSX,
# attach the .vsix to a GitHub release. Re-running after a partial failure is safe: a version that is
# already published on a registry is detected and skipped.
# Required repository secrets: VSCE_PAT (Azure DevOps PAT, Marketplace › Manage), OVSX_PAT (open-vsx.org token).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Two tags in a row must not race for the same version.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # only this job creates the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # nothing here pushes; do not leave a token in .git/config during npm ci
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag is on main and matches package.json
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag commit is not on main"; exit 1; }
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || { echo "tag $TAG != package.json $PKG"; exit 1; }
      - name: Refuse to publish a build whose Pro tier cannot be bought
        run: |
          node -e "const s=require('fs').readFileSync('src/pro/polarConfig.ts','utf8'); const org=/POLAR_ORGANIZATION_ID = '([^']*)'/.exec(s)?.[1]; const url=/POLAR_CHECKOUT_URL = '([^']*)'/.exec(s)?.[1]; if(!org||!url){console.error('POLAR_ORGANIZATION_ID / POLAR_CHECKOUT_URL are empty in src/pro/polarConfig.ts — the README and Marketplace listing advertise Pro; fill them (docs/TUS-TAREAS.md, block B) before tagging.'); process.exit(1);} console.log('Pro configured');"
      - run: npm run check
      - run: node scripts/l10n-sync.mjs
      - run: npx vsce package --no-dependencies -o "handsfree-claude-code-${GITHUB_REF_NAME}.vsix"
      # Publish, and treat "this version is already there" as success. Asking first is not enough: the
      # gallery answers from caches that disagree for hours, so a re-run after a partial failure could
      # both skip a missing version and fail on an existing one.
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -o pipefail
          # Reintentos con backoff: el Marketplace (Azure DevOps) devuelve TF10216
          # ("services are currently unavailable") de forma transitoria.
          attempt=1; max=4
          while :; do
            if out=$(npx vsce publish --no-dependencies --packagePath "handsfree-claude-code-${GITHUB_REF_NAME}.vsix" 2>&1); then echo "$out"; break; fi
            echo "$out"
            if echo "$out" | grep -qiE "already exists|already published"; then echo "Marketplace already has this version — continuing"; break; fi
            if [ $attempt -ge $max ]; then exit 1; fi
            wait_s=$((attempt*20)); echo "Fallo transitorio (p. ej. TF10216); reintento $attempt/$max en ${wait_s}s…"; sleep $wait_s
            attempt=$((attempt+1))
          done
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }} # ovsx reads the token from the environment; never pass it on the command line
        run: |
          set -o pipefail
          # Mismo patrón de reintentos ante fallos transitorios del servicio.
          attempt=1; max=4
          while :; do
            if out=$(npx ovsx publish "handsfree-claude-code-${GITHUB_REF_NAME}.vsix" 2>&1); then echo "$out"; break; fi
            echo "$out"
            if echo "$out" | grep -qiE "already exists|already published"; then echo "Open VSX already has this version — continuing"; break; fi
            if [ $attempt -ge $max ]; then exit 1; fi
            wait_s=$((attempt*20)); echo "Fallo transitorio; reintento $attempt/$max en ${wait_s}s…"; sleep $wait_s
            attempt=$((attempt+1))
          done
      - name: GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: handsfree-claude-code-${{ github.ref_name }}.vsix
          generate_release_notes: true
